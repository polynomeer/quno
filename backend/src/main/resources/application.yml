spring:
  application:
    name: qunobackend
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    hikari:
      # 기본값(30s)이면 PostgreSQL 장애 시 헬스체크·API 요청이 모두 30초씩 멈춘 뒤에야 실패로
      # 처리된다 — 장애 감지가 느려지고 스레드가 오래 점유돼 부하가 커진다(장애 시나리오 A2,
      # ADR-0054). 3초로 낮춰 빠르게 실패하도록 한다.
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        # prometheus: 스크레이핑 엔드포인트에 앱 차원 인증을 걸지 않는다(Prometheus 서버가 우리
        # JWT를 발급받을 수 없음) — SecurityConfig에서 permitAll, 실제 접근 통제는 인프라
        # 레벨(내부망/리버스 프록시)에서 해야 한다(ADR-0045).
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never

quno:
  cors:
    allowed-origins:
      - http://localhost:3000
  rate-limit:
    # 로컬 개발·테스트 기본값(사실상 무제한) — 운영은 application-prod.yml이 좁게 덮어쓴다.
    capacity: 1000
    refill-period-seconds: 60
  jwt:
    # Dev-only default. Override via QUNO_JWT_SECRET outside local dev.
    secret: "change-me-quno-dev-secret-please-override-in-real-environments-0123456789"
    access-token-ttl-seconds: 1800
    refresh-token-ttl-seconds: 1209600
  mail:
    from-address: "noreply@quno.dev"
  toss:
    # Toss Payments' publicly documented "문서용 테스트 키" — usable without signing up, real
    # money never moves. Override via QUNO_TOSS_CLIENT_KEY / QUNO_TOSS_SECRET_KEY outside local
    # dev with a real merchant's keys (see ADR-0037).
    client-key: "test_ck_D5GePWvyJnrK0W0k6q8gLzN97Eoq"
    secret-key: "test_sk_zXLkKEypNArWmo50nX3lmeaxYG5R"
    api-base-url: "https://api.tosspayments.com"
  direct-ask:
    # KRW, flat fee. No real usage data yet — same "start at a round number, revisit later"
    # judgment as ADR-0032's vote weights.
    fee-amount: 1000

sentry:
  # 빈 값이면 SDK가 스스로 비활성화된다(Sentry 공식 동작) — 계정 개설·DSN 발급은 사람이 할 일
  # (production-readiness.md A)이라 이 값이 없어도 기동에 지장이 없어야 한다.
  dsn: ""

server:
  # SIGTERM을 받아도 처리 중인 요청은 끝까지 완료한 뒤 종료한다 — 명시하지 않아도 이미 이렇게
  # 동작하고 있었지만(장애 시나리오 E1), 향후 Spring Boot 업그레이드로 기본값이 바뀌어도 조용히
  # 회귀하지 않도록 명시적으로 고정한다.
  shutdown: graceful
