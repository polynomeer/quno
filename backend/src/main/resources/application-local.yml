server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5442/quno
    username: quno
    password: quno
  data:
    mongodb:
      uri: mongodb://localhost:27017/quno
    redis:
      host: localhost
      port: 6390
  mail:
    # Mailpit local SMTP catcher (docker-compose) — no real provider configured. Inspect
    # captured mail at http://localhost:8026.
    host: localhost
    port: 1026
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

management:
  endpoint:
    health:
      show-details: always
