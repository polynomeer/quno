server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5442/quno
    username: quno
    password: quno
  # NOTE: Spring Boot 4 moved MongoDB connection properties from spring.data.mongodb.* to
  # spring.mongodb.* (org.springframework.boot.mongodb.autoconfigure.MongoProperties) — the old
  # prefix silently binds nothing and the client falls back to mongodb://localhost/test. Verified
  # via GET /actuator/configprops during Phase 24 (ADR-0036); see that ADR for the full story.
  mongodb:
    host: localhost
    port: 27017
    database: quno
  data:
    redis:
      host: localhost
      port: 6390
  mail:
    # Mailpit local SMTP catcher (docker-compose) — no real provider configured. Inspect
    # captured mail at http://localhost:8026.
    host: localhost
    port: 1026
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

management:
  endpoint:
    health:
      show-details: always
