name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # docker-compose.yml이 application-local.yml과 동일한 포트(5442/6390 등)를 쓰므로
      # 로컬 개발과 똑같은 방식으로 인프라를 띄운다 — `./gradlew test`가 local 프로필로 이 인프라에
      # 직접 연결한다(build.gradle.kts의 test 태스크 설정 참고).
      - name: 인프라 기동 (PostgreSQL/MongoDB/Redis/Mailpit)
        run: docker compose up -d

      - name: PostgreSQL 준비 대기
        run: |
          until docker compose exec -T postgres pg_isready -U quno >/dev/null 2>&1; do
            sleep 1
          done

      - name: 코드 스타일 검사 (ktlint)
        working-directory: backend
        run: ./gradlew ktlintCheck --no-daemon

      - name: 백엔드 테스트
        working-directory: backend
        run: ./gradlew test --no-daemon

      # 수치를 강제하는 게 목적이 아니라 PR에서 커버리지가 급격히 떨어지면 눈에 띄게 하는
      # 용도라 실패 조건은 없다(quality-improvement-plan.md Q-1) — 리포트만 아티팩트로 남긴다.
      - name: 커버리지 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/build/reports/jacoco/test/html/
          retention-days: 14

      - name: 인프라 정리
        if: always()
        run: docker compose down -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: 단위 테스트 + 커버리지
        working-directory: frontend
        run: npm run test:coverage

      - name: 커버리지 리포트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14

      - name: 빌드
        working-directory: frontend
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 인프라 기동 (PostgreSQL/MongoDB/Redis/Mailpit)
        run: docker compose up -d

      - name: PostgreSQL 준비 대기
        run: |
          until docker compose exec -T postgres pg_isready -U quno >/dev/null 2>&1; do
            sleep 1
          done

      # 백엔드는 백그라운드로 띄우고 헬스체크로 준비를 기다린다 — Playwright의 webServer 설정은
      # 프론트엔드 dev 서버만 관리한다(playwright.config.ts 참고).
      - name: 백엔드 기동
        working-directory: backend
        run: |
          SPRING_PROFILES_ACTIVE=local nohup ./gradlew bootRun --no-daemon > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8081/actuator/health >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "백엔드가 준비되지 않았습니다"; cat /tmp/backend.log; exit 1

      - name: 프론트엔드 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: Playwright 브라우저 설치
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: E2E 테스트 (회원가입 → 질문 작성 → 답변)
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8081
          CI: true
        run: npx playwright test

      - name: 실패 시 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: 인프라 정리
        if: always()
        run: docker compose down -v
