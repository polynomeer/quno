name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # docker-compose.yml이 application-local.yml과 동일한 포트(5442/6390 등)를 쓰므로
      # 로컬 개발과 똑같은 방식으로 인프라를 띄운다 — `./gradlew test`가 local 프로필로 이 인프라에
      # 직접 연결한다(build.gradle.kts의 test 태스크 설정 참고).
      - name: 인프라 기동 (PostgreSQL/MongoDB/Redis/Mailpit)
        run: docker compose up -d

      - name: PostgreSQL 준비 대기
        run: |
          until docker compose exec -T postgres pg_isready -U quno >/dev/null 2>&1; do
            sleep 1
          done

      - name: 백엔드 테스트
        working-directory: backend
        run: ./gradlew test --no-daemon

      - name: 인프라 정리
        if: always()
        run: docker compose down -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: 단위 테스트
        working-directory: frontend
        run: npm test -- --run

      - name: 빌드
        working-directory: frontend
        run: npm run build
