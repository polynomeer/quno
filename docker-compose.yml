# Host ports for postgres/redis are non-default (5442/6390) to avoid clashing
# with other local projects' containers on this machine; see application-local.yml.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: quno
      POSTGRES_USER: quno
      POSTGRES_PASSWORD: quno
    ports:
      - "5442:5432"
    volumes:
      - quno-postgres-data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - quno-mongo-data:/data/db

  redis:
    image: redis:7
    ports:
      - "6390:6379"
    volumes:
      - quno-redis-data:/data

  # Local SMTP catcher for Verified Organization email verification (Phase 23, ADR-0035) — no
  # real email provider configured. Web UI to inspect captured mail at http://localhost:8026,
  # SMTP on 1026 (non-default to match the other services' clash-avoidance ports).
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1026:1025"
      - "8026:8025"

volumes:
  quno-postgres-data:
  quno-mongo-data:
  quno-redis-data:
